name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG_PATH: .wrangler/logs/
      CI: 'true'
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.9
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated Worker types
        run: pnpm types:check
      - name: Check types, lint, tests and public source
        run: pnpm check
      - name: Check portable modules independently of Workers types
        run: pnpm types:portable
      - name: Build and verify workerd, MCP Inspector and smoke script
        run: pnpm verify:runtime
